<template id="__bundler_thumbnail"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" fill="#FAF4E9"/><g stroke="#8E8577" stroke-width="4" fill="none" stroke-linecap="round"><path d="M62 92h76v22a38 38 0 0 1-38 38 38 38 0 0 1-38-38z"/><path d="M138 100h12a13 13 0 0 1 0 26h-12"/><path d="M88 74c0-9 8-11 8-20M112 74c0-9 8-11 8-20" stroke="#BEC99B"/></g></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Sodam Voice';src:url('../assets/fonts/KyoboHandwriting2025lyb.ttf') format('truetype');font-display:swap;}
html,body{margin:0;padding:0;background:#E7E1D7;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
a{color:#6E7A52;text-decoration:none;}
a:hover{color:#514B45;}
input,button,textarea{font:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;}
@keyframes sodamFall{0%{transform:translateY(-70px) rotate(4deg);opacity:0}12%{opacity:.55}100%{transform:translateY(960px) rotate(4deg);opacity:.1}}
@keyframes sodamDrift{0%{transform:translate(0,-50px);opacity:0}14%{opacity:.8}100%{transform:translate(34px,950px);opacity:.05}}
@keyframes sodamSteam{0%{transform:translateY(10px) scaleX(.9);opacity:0}30%{opacity:1}100%{transform:translateY(-30px) scaleX(1.35);opacity:0}}
@keyframes sodamIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes sodamFade{from{opacity:0}to{opacity:1}}
@keyframes sodamCard{from{opacity:0;transform:translateY(28px) rotate(-1.1deg) scale(.965)}to{opacity:1;transform:translateY(0) rotate(-1.1deg) scale(1)}}
@keyframes sodamPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
</style>
</helmet>

<div style="position:relative;width:412px;height:892px;overflow:hidden;background:#FAF4E9;font-family:'Noto Sans KR',system-ui,sans-serif;color:#514B45;-webkit-font-smoothing:antialiased;">

  <div style="position:absolute;inset:0;background-image:url('./tex/paper_soft.png');background-size:210px 210px;opacity:.55;mix-blend-mode:multiply;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:{{ lightWash }}"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(115% 85% at 50% 42%, rgba(255,255,255,0) 42%, rgba(120,104,86,.07) 100%);"></div>

  <sc-if value="{{ isRain }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:8%;top:0;width:9px;animation:sodamFall 5.4s linear -0.2s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:19%;top:0;width:7px;animation:sodamFall 6.8s linear -1.4s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:31%;top:0;width:11px;animation:sodamFall 4.9s linear -3.1s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:44%;top:0;width:8px;animation:sodamFall 6.2s linear -0.9s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:57%;top:0;width:10px;animation:sodamFall 5.7s linear -2.4s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:68%;top:0;width:7px;animation:sodamFall 7.1s linear -4.2s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:79%;top:0;width:9px;animation:sodamFall 5.1s linear -1.9s infinite;">
      <img src="../assets/images/status_raindrop.png" style="position:absolute;left:90%;top:0;width:8px;animation:sodamFall 6.5s linear -3.6s infinite;">
    </div>
  </sc-if>

  <sc-if value="{{ isSnow }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
      <div style="position:absolute;left:11%;top:0;width:6px;height:6px;border-radius:50%;background:#fff;filter:blur(1.5px);animation:sodamDrift 11s linear -1s infinite;"></div>
      <div style="position:absolute;left:24%;top:0;width:4px;height:4px;border-radius:50%;background:#fff;filter:blur(1.2px);animation:sodamDrift 14s linear -5s infinite;"></div>
      <div style="position:absolute;left:38%;top:0;width:7px;height:7px;border-radius:50%;background:#fff;filter:blur(2px);animation:sodamDrift 9.5s linear -3s infinite;"></div>
      <div style="position:absolute;left:52%;top:0;width:5px;height:5px;border-radius:50%;background:#fff;filter:blur(1.4px);animation:sodamDrift 12.5s linear -7s infinite;"></div>
      <div style="position:absolute;left:66%;top:0;width:6px;height:6px;border-radius:50%;background:#fff;filter:blur(1.6px);animation:sodamDrift 10.5s linear -2s infinite;"></div>
      <div style="position:absolute;left:81%;top:0;width:4px;height:4px;border-radius:50%;background:#fff;filter:blur(1.2px);animation:sodamDrift 13.5s linear -6s infinite;"></div>
      <div style="position:absolute;left:93%;top:0;width:6px;height:6px;border-radius:50%;background:#fff;filter:blur(1.8px);animation:sodamDrift 11.5s linear -9s infinite;"></div>
    </div>
  </sc-if>

  <sc-if value="{{ onCalendar }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:34px 26px 30px;">

      <div style="display:flex;align-items:flex-start;gap:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;letter-spacing:2.2px;font-weight:400;color:#81786F;">{{ monthTitle }}</div>
          <div style="margin-top:7px;font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:14px;color:#A69D93;">{{ contextLabel }}</div>
        </div>
        <div style="display:flex;gap:2px;padding-top:2px;">
          <button onClick="{{ prevMonth }}" aria-label="이전 달" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;"><img src="../assets/ui/calendar_prev_default.png" style="width:34px;height:34px;object-fit:contain;"></button>
          <button onClick="{{ nextMonth }}" aria-label="다음 달" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;"><img src="../assets/ui/calendar_next_default.png" style="width:34px;height:34px;object-fit:contain;"></button>
        </div>
      </div>

      <div style="height:172px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-top:26px;">
        <div style="position:relative;width:106px;height:66px;display:flex;align-items:flex-end;justify-content:center;">
          <div style="position:absolute;bottom:52px;left:50%;transform:translateX(-50%);display:flex;gap:9px;opacity:{{ steamOpacity }}">
            <div style="width:3px;height:26px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.85));filter:blur(2.6px);animation:sodamSteam 5.2s ease-in-out infinite;"></div>
            <div style="width:3px;height:34px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.9));filter:blur(2.6px);animation:sodamSteam 4.4s ease-in-out -1.6s infinite;"></div>
            <div style="width:3px;height:24px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.8));filter:blur(2.6px);animation:sodamSteam 5.8s ease-in-out -3s infinite;"></div>
          </div>
          <img src="../assets/images/tea_bowl_v1.png" style="width:100px;object-fit:contain;filter:{{ teaFilter }}">
        </div>
        <button onClick="{{ openSession }}" style="display:flex;align-items:center;gap:8px;padding:10px 20px;min-height:44px;border-radius:999px;border:1px solid #DCD3C6;background:rgba(255,255,255,.42);font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:15px;color:#6E6259;">
          <span style="white-space:nowrap;">{{ ctaLabel }}</span>
          <span style="font-size:13px;color:#A69D93;">→</span>
        </button>
      </div>

      <div style="display:flex;margin-top:26px;padding-bottom:9px;border-bottom:1px solid #EAE2D6;">
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">M</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">T</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">W</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">T</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">F</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">S</div>
        <div style="flex:1;text-align:center;font-size:10.5px;letter-spacing:1.3px;font-weight:500;color:#BDB2A7;">S</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:60px;align-content:start;margin-top:8px;">
        <sc-for list="{{ cells }}" as="cell" hint-placeholder-count="35">
          <div onClick="{{ cell.tap }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:3px;">
            <sc-if value="{{ cell.isToday }}" hint-placeholder-val="{{ false }}">
              <div style="width:29px;height:29px;border-radius:50%;background:#E1E7CB;border:1px solid #BEC99B;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#586047;">{{ cell.day }}</div>
            </sc-if>
            <sc-if value="{{ cell.plain }}" hint-placeholder-val="{{ true }}">
              <div style="height:29px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:300;color:{{ cell.numColor }}">{{ cell.day }}</div>
            </sc-if>
            <sc-if value="{{ cell.finished }}" hint-placeholder-val="{{ false }}">
              <img src="../assets/images/trace_blossom.png" style="width:19px;height:19px;object-fit:contain;">
            </sc-if>
            <sc-if value="{{ cell.unfinished }}" hint-placeholder-val="{{ false }}">
              <img src="../assets/images/status_raindrop.png" style="width:13px;height:13px;object-fit:contain;opacity:.85;">
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:auto;padding-top:12px;border-top:1px solid #EAE2D6;">
        <div style="display:flex;align-items:center;gap:5px;"><img src="../assets/images/trace_blossom.png" style="width:13px;height:13px;"><span style="font-size:10.5px;color:#B0A69B;">마친 날</span></div>
        <div style="display:flex;align-items:center;gap:5px;"><img src="../assets/images/status_raindrop.png" style="width:9px;height:9px;opacity:.85;"><span style="font-size:10.5px;color:#B0A69B;">남겨둔 날</span></div>
        <div style="font-size:10.5px;color:#C2B8AC;">{{ visitLabel }}</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ onSession }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;">
      <div style="position:absolute;top:36px;left:28px;font-size:12px;letter-spacing:1.6px;color:#9A9088;">{{ dateLabel }}</div>
      <button onClick="{{ backToCalendar }}" aria-label="달력" style="position:absolute;top:26px;right:16px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;"><img src="../assets/ui/calendar_default.png" style="width:32px;height:32px;object-fit:contain;"></button>

      <div style="position:absolute;left:0;right:0;top:104px;bottom:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="width:300px;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;">
          <span style="font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:18px;line-height:1.55;color:#7E756C;text-wrap:pretty;">{{ teaLine }}</span>
        </div>
        <div style="position:relative;width:236px;display:flex;justify-content:center;margin-top:6px;">
          <div style="position:absolute;bottom:calc(100% - 26px);left:50%;transform:translateX(-50%);display:flex;gap:13px;transition:opacity .6s ease;opacity:{{ cupSteam }}">
            <div style="width:4px;height:34px;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.8));filter:blur(3.4px);animation:sodamSteam 5.2s ease-in-out infinite;"></div>
            <div style="width:4px;height:46px;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.85));filter:blur(3.4px);animation:sodamSteam 4.4s ease-in-out -1.6s infinite;"></div>
            <div style="width:4px;height:30px;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(163,152,138,.75));filter:blur(3.4px);animation:sodamSteam 5.8s ease-in-out -3s infinite;"></div>
          </div>
          <img src="{{ bowlSrc }}" style="width:236px;object-fit:contain;transition:opacity .42s ease;filter:{{ teaFilter }}">
        </div>
        <div style="width:300px;min-height:58px;margin-top:2px;display:flex;align-items:flex-start;justify-content:center;text-align:center;">
          <span style="font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:16px;line-height:1.5;color:#514B45;text-wrap:pretty;">{{ userLine }}</span>
        </div>
      </div>

      <sc-if value="{{ canType }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;left:26px;right:26px;bottom:48px;display:flex;align-items:center;gap:4px;min-height:56px;padding-left:20px;padding-right:4px;border:1px solid #DCD3C6;border-radius:30px;background:rgba(255,255,255,.34);">
          <input value="{{ draft }}" onInput="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="천천히 생각나는 대로" style="flex:1;min-width:0;border:0;background:none;outline:none;font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:16px;color:#514B45;">
          <button onClick="{{ send }}" aria-label="보내기" style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;"><img src="{{ sendSrc }}" style="width:46px;height:46px;object-fit:contain;"></button>
        </div>
      </sc-if>

      <sc-if value="{{ cupEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:26px;right:26px;bottom:74px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:sodamIn .34s ease-out both;">
          <button onClick="{{ refill }}" style="width:224px;min-height:48px;border-radius:999px;background:#E1E7CB;font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:16px;color:#5C6349;">한 잔 더 마실래</button>
          <button onClick="{{ finish }}" style="width:224px;min-height:48px;border-radius:999px;border:1px solid #DCD3C6;font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:16px;color:#8E847B;">오늘 이만 마칠래</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ onClosing }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;animation:sodamFade .5s ease both;">
      <div style="position:absolute;top:36px;left:28px;font-size:12px;letter-spacing:1.6px;color:#9A9088;">{{ dateLabel }}</div>

      <div style="position:absolute;left:0;right:0;top:104px;bottom:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="width:300px;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;">
          <span style="font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:18px;line-height:1.55;color:#9A8F85;text-wrap:pretty;">{{ closingLine }}</span>
        </div>
        <button onClick="{{ openFortune }}" aria-label="한 마디 펼치기" style="position:relative;width:236px;height:200px;display:flex;align-items:center;justify-content:center;margin-top:10px;">
          <img src="../assets/images/closing_saucer.png" style="width:230px;object-fit:contain;">
          <img src="../assets/images/trace_blossom.png" style="position:absolute;width:30px;object-fit:contain;opacity:{{ blossomOpacity }};transition:opacity .38s ease;animation:sodamPulse 3.6s ease-in-out infinite;">
        </button>
        <div style="width:300px;min-height:44px;margin-top:6px;text-align:center;font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:14px;color:#B4A99E;opacity:{{ hintOpacity }};transition:opacity .5s ease;">벚꽃을 누르면, 내일 기억할 한 마디</div>
      </div>

      <button onClick="{{ backToCalendar }}" style="position:absolute;left:0;right:0;bottom:56px;min-height:44px;font-size:13px;letter-spacing:.6px;color:#A69D93;">달력으로</button>
    </div>
  </sc-if>

  <sc-if value="{{ onFortune }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;background:rgba(84,74,64,.16);backdrop-filter:blur(2px);animation:sodamFade .3s ease both;">
      <div style="position:relative;width:302px;padding:34px 30px 26px;border-radius:3px;background:#FCF8F0;background-image:url('./tex/paper_card.png');background-size:150px 150px;box-shadow:0 18px 40px -20px rgba(88,74,58,.45),0 2px 0 rgba(255,255,255,.7) inset;animation:sodamCard .5s cubic-bezier(.2,.8,.2,1) both;">
        <div style="position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(180deg,rgba(140,122,100,.14),rgba(140,122,100,0));"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1.8px;color:#B4A99E;">
          <span>{{ fortuneDate }}</span>
          <span>{{ fortuneSeason }}</span>
        </div>
        <div style="height:1px;margin:16px 0 22px;background:#E8DFD1;"></div>
        <div style="min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;">
          <span style="font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:22px;line-height:1.6;color:#4E4740;text-wrap:pretty;">{{ fortuneText }}</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:22px;">
          <img src="../assets/images/trace_blossom.png" style="width:14px;height:14px;object-fit:contain;">
          <span style="font-family:'Sodam Voice','Noto Sans KR',sans-serif;font-size:12px;letter-spacing:.4px;color:#B0A69B;">소담</span>
        </div>
      </div>
      <button onClick="{{ closeFortune }}" style="margin-top:26px;min-height:44px;padding:0 22px;font-size:13px;letter-spacing:.6px;color:#F3EDE3;text-shadow:0 1px 6px rgba(70,60,50,.5);">접어두기</button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:892},&quot;season&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;봄&quot;,&quot;여름&quot;,&quot;장마&quot;,&quot;가을&quot;,&quot;겨울&quot;],&quot;default&quot;:&quot;가을&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;그날의 맥락&quot;},&quot;weather&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;맑음&quot;,&quot;흐림&quot;,&quot;비&quot;,&quot;눈&quot;],&quot;default&quot;:&quot;맑음&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;그날의 맥락&quot;},&quot;visits&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:60,&quot;default&quot;:38,&quot;unit&quot;:&quot;잔&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;누적 관계&quot;},&quot;sipsPerCup&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:3,&quot;max&quot;:9,&quot;default&quot;:6,&quot;unit&quot;:&quot;모금&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;한 잔의 길이&quot;},&quot;useAI&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;응답 방식&quot;}}">
class Component extends DCLogic {
  static S = {
    '봄':   {paper:'#FAF7F2', tea:'none',                                              steam:.22, name:'봄'},
    '여름': {paper:'#F7F9F3', tea:'saturate(1.18) hue-rotate(6deg)',                   steam:.07, name:'여름'},
    '장마': {paper:'#F1F3F1', tea:'saturate(.86) brightness(.99)',                     steam:.16, name:'장마'},
    '가을': {paper:'#FAF4E9', tea:'sepia(.3) hue-rotate(-6deg) saturate(1.2)',         steam:.34, name:'가을'},
    '겨울': {paper:'#F5F5F4', tea:'sepia(.46) hue-rotate(-4deg) saturate(1.2) brightness(.97)', steam:.5, name:'겨울'}
  };
  static W = {
    '맑음': {wash:'radial-gradient(120% 78% at 74% 6%, rgba(255,244,214,.5), rgba(255,244,214,0) 58%)', name:'맑음'},
    '흐림': {wash:'linear-gradient(180deg, rgba(206,209,206,.3), rgba(206,209,206,0) 48%)', name:'흐림'},
    '비':   {wash:'linear-gradient(180deg, rgba(178,190,193,.38), rgba(178,190,193,.05) 58%)', name:'비'},
    '눈':   {wash:'radial-gradient(120% 68% at 50% 0%, rgba(255,255,255,.62), rgba(236,241,246,.08) 62%)', name:'눈'}
  };
  static BOWLS = [
    '../assets/images/tea_bowl_empty.png',
    '../assets/images/tea_bowl_1of6.png',
    '../assets/images/tea_bowl_2of6.png',
    '../assets/images/tea_bowl_3of6.png',
    '../assets/images/tea_bowl_4of6.png',
    '../assets/images/tea_bowl_5of6.png',
    '../assets/images/tea_bowl_v1.png'
  ];
  static VOICE = {
    1: {open:'오늘은 어떤 하루였어?',
        res:['그랬구나.','응, 듣고 있어.','천천히 말해도 돼.','(호로록)','그럴 수 있지.','음, 그래.'],
        close:'내일 또 들러줘.'},
    2: {open:'왔네. 오늘은 어땠어?',
        res:['그래, 그런 날도 있지.','(호로록) 애썼네.','음… 조금 더 들어볼까.','그 말, 오래 참았구나.','오늘은 목소리가 낮네.','그럴 만했네.'],
        close:'오늘도 잘 마쳤네.'},
    3: {open:'자네구먼. 앉아.',
        res:['자네도 참.','그럼, 그럴 수 있지.','(호로록) 오래 왔네, 자네.','말 안 해도 알겠어.','……','자네 얘기는 늘 뒤가 있지.'],
        close:'가서 푹 쉬어, 자네.'}
  };
  static FORTUNE = ['오늘 한 말은 여기 두고 가.','서둘러 답을 찾지 않아도 돼.','내일의 자네가 알아서 할 거야.','잘 지나간 하루도 하루야.','한 모금씩이면 충분해.','애쓴 건 자네만 알아도 돼.'];
  static MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  static MON3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  static SYS = '너는 모바일 앱 "소담" 안에서 사람의 하루를 들어주는 존재다. 깊은 산 오래된 다실의 할머니이자 신선 같은 말투. 반말. 조언·해결책·질문·칭찬 금지. 판단하지 않고 그저 받아준다. 한 문장, 24자 이내. 이모지·따옴표·마크다운 금지.';

  state = {
    screen: 'calendar',
    level: 6, sips: 0, cups: 1,
    teaLine: '', userLine: '', draft: '',
    closingLine: '', showBlossom: false, showHint: false,
    fortuneText: '', fortuneDate: '', fortuneSeason: '', fortuneFrom: 'closing',
    monthOffset: 0, busy: false, days: {}, visits: 0
  };

  gen = 0;

  componentDidMount() {
    const seeded = this.seed();
    this.setState({ days: seeded.days, visits: seeded.visits });
  }

  // ── context ──────────────────────────────────────────
  get season() { return Component.S[this.props.season] ? this.props.season : '가을'; }
  get weather() { return Component.W[this.props.weather] ? this.props.weather : '맑음'; }
  get stage() {
    const v = this.state.visits;
    if (v <= 6) return 1;
    if (v <= 20) return 2;
    return 3;
  }
  get voice() { return Component.VOICE[this.stage]; }
  get maxSips() { return Math.max(3, Math.min(9, this.props.sipsPerCup ?? 6)); }

  today() { return new Date(); }
  key(d) {
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // ── seeded history so the calendar reads like a used app ──
  seed() {
    const t = this.today();
    const days = {};
    let visits = 0;
    for (let back = 1; back <= 64; back++) {
      const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back);
      const m = (d.getDate() * 7 + d.getMonth() * 3) % 5;
      if (m < 3) {
        days[this.key(d)] = { status: 'finished', fortune: Component.FORTUNE[(d.getDate() + back) % Component.FORTUNE.length] };
        visits++;
      } else if (m === 3) {
        days[this.key(d)] = { status: 'unfinished' };
        visits++;
      }
    }
    const forced = this.props.visits;
    return { days, visits: (forced === undefined || forced === null) ? visits : forced };
  }

  pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  async wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async type(text, gen) {
    const chars = Array.from(text);
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const d = '.,!?'.includes(c) ? 190 + Math.random() * 60 : c === ' ' ? 60 + Math.random() * 40 : 92 + Math.random() * 52;
      await this.wait(d);
      if (gen !== this.gen) return;
      this.setState({ teaLine: chars.slice(0, i + 1).join('') });
    }
  }

  async ai(userPrompt, fallback) {
    if (this.props.useAI === false) return fallback;
    try {
      if (!(window.claude && window.claude.complete)) return fallback;
      const out = await window.claude.complete({
        system: Component.SYS,
        messages: [{ role: 'user', content: userPrompt }]
      });
      const line = String(out || '').trim().split('\n')[0].replace(/^["'`\s]+|["'`\s]+$/g, '');
      return line && line.length <= 40 ? line : fallback;
    } catch (e) { return fallback; }
  }

  said = [];

  // ── flow ─────────────────────────────────────────────
  openSession = async () => {
    const gen = ++this.gen;
    this.said = [];
    this.setState({ screen: 'session', level: this.maxSips, sips: 0, cups: 1, teaLine: '', userLine: '', draft: '', busy: true });
    await this.wait(620);
    if (gen !== this.gen) return;
    await this.type(this.voice.open, gen);
    if (gen === this.gen) this.setState({ busy: false });
  };

  backToCalendar = () => { this.gen++; this.setState({ screen: 'calendar', busy: false }); };

  onDraft = (e) => this.setState({ draft: e.target.value });
  onKey = (e) => { if (e.key === 'Enter') { e.preventDefault(); this.send(); } };

  send = async () => {
    const text = (this.state.draft || '').trim();
    if (!text || this.state.busy || this.state.sips >= this.maxSips) return;
    const gen = ++this.gen;
    this.said.push(text);

    this.setState({ userLine: text, teaLine: '', draft: '', busy: true });
    await this.wait(340);
    if (gen !== this.gen) return;

    const sips = Math.min(this.maxSips, this.state.sips + 1);
    this.setState({ sips, level: this.maxSips - sips });
    await this.wait(430);
    if (gen !== this.gen) return;

    const last = sips >= this.maxSips;
    let line = this.pick(this.voice.res);
    if (last) {
      line = await this.ai(
        '사람이 오늘 이런 이야기를 했다: ' + this.said.join(' / ') + '\n찻잔이 비었다. 헤어지기 전 마지막 한 마디를 한 문장으로.',
        line
      );
      if (gen !== this.gen) return;
    }
    await this.type(line, gen);
    if (gen !== this.gen) return;

    if (last) {
      await this.wait(700);
      if (gen !== this.gen) return;
      this.setState({ teaLine: '잔이 비었어요', userLine: '', busy: false });
    } else {
      this.setState({ busy: false });
    }
  };

  refill = async () => {
    const gen = ++this.gen;
    const m = this.maxSips;
    this.setState({ sips: 0, cups: this.state.cups + 1, teaLine: '', userLine: '', level: 0, busy: true });
    for (const [d, v] of [[140, Math.round(m * .35)], [170, Math.round(m * .7)], [180, m]]) {
      await this.wait(d);
      if (gen !== this.gen) return;
      this.setState({ level: v });
    }
    await this.wait(280);
    if (gen !== this.gen) return;
    await this.type(this.stage === 3 ? '그래, 더 앉아 있어.' : '한 잔 더 우렸어.', gen);
    if (gen === this.gen) this.setState({ busy: false });
  };

  finish = async () => {
    const gen = ++this.gen;
    const t = this.today();
    this.setState({ screen: 'closing', closingLine: '', showBlossom: false, showHint: false, busy: true });
    await this.wait(560);
    if (gen !== this.gen) return;
    this.setState({ showBlossom: true });

    const close = await this.ai(
      '사람이 오늘 이런 이야기를 했다: ' + (this.said.join(' / ') || '별말 없었다') + '\n찻잔을 치우며 건네는 작별 한 마디를 한 문장으로.',
      this.voice.close
    );
    if (gen !== this.gen) return;
    this.setState({ closingLine: close });
    await this.wait(1400);
    if (gen !== this.gen) return;
    this.setState({ showHint: true, busy: false });

    const days = Object.assign({}, this.state.days);
    days[this.key(t)] = { status: 'finished', fortune: '' };
    this.setState({ days, visits: this.state.visits + 1 });
  };

  openFortune = async () => {
    const t = this.today();
    const fallback = this.pick(Component.FORTUNE);
    this.setState({
      screen: 'fortune', fortuneFrom: 'closing', fortuneText: '',
      fortuneDate: t.getDate() + ' ' + Component.MON3[t.getMonth()],
      fortuneSeason: Component.S[this.season].name + ' · ' + Component.W[this.weather].name
    });
    const line = await this.ai(
      '사람이 오늘 이런 이야기를 했다: ' + (this.said.join(' / ') || '별말 없었다') + '\n내일 이 사람이 기억하면 좋을 한 마디를 20자 이내 한 줄로. 교훈이나 지시가 아니라 그저 남겨두는 말.',
      fallback
    );
    const days = Object.assign({}, this.state.days);
    days[this.key(t)] = { status: 'finished', fortune: line };
    this.setState({ fortuneText: line, days });
  };

  openPast = (dateKey) => {
    const rec = this.state.days[dateKey];
    if (!rec || rec.status !== 'finished') return;
    const [y, m, d] = dateKey.split('-').map(Number);
    const mo = m - 1;
    const season = mo <= 1 || mo === 11 ? '겨울' : mo <= 4 ? '봄' : mo === 5 || mo === 6 ? '장마' : mo === 7 ? '여름' : '가을';
    this.setState({
      screen: 'fortune', fortuneFrom: 'calendar',
      fortuneText: rec.fortune || this.pick(Component.FORTUNE),
      fortuneDate: d + ' ' + Component.MON3[mo],
      fortuneSeason: season
    });
  };

  closeFortune = () => this.setState({ screen: 'calendar' });

  shiftMonth = (n) => this.setState({ monthOffset: this.state.monthOffset + n });

  // ── calendar model ───────────────────────────────────
  buildCells() {
    const t = this.today();
    const base = new Date(t.getFullYear(), t.getMonth() + this.state.monthOffset, 1);
    const daysIn = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const lead = (base.getDay() + 6) % 7;
    const rows = Math.ceil((lead + daysIn) / 7);
    const out = [];
    for (let i = 0; i < rows * 7; i++) {
      const day = i - lead + 1;
      if (day < 1 || day > daysIn) { out.push({ key: 'e' + i, day: '', tap: () => {}, plain: false, isToday: false, finished: false, unfinished: false, numColor: 'transparent' }); continue; }
      const d = new Date(base.getFullYear(), base.getMonth(), day);
      const k = this.key(d);
      const rec = this.state.days[k];
      const isToday = k === this.key(t);
      const future = d > t && !isToday;
      out.push({
        key: k, day: String(day), isToday, plain: !isToday,
        numColor: future ? '#D2C9BE' : '#A69D93',
        finished: !!rec && rec.status === 'finished',
        unfinished: !!rec && rec.status === 'unfinished',
        tap: isToday ? this.openSession : (rec && rec.status === 'finished' ? () => this.openPast(k) : () => {})
      });
    }
    return out;
  }

  renderVals() {
    const s = this.state;
    const S = Component.S[this.season];
    const W = Component.W[this.weather];
    const t = this.today();
    const vm = new Date(t.getFullYear(), t.getMonth() + s.monthOffset, 1);
    const cupEmpty = s.screen === 'session' && s.sips >= this.maxSips && !s.busy;

    return {
      lightWash: W.wash,
      teaFilter: S.tea,
      steamOpacity: S.steam,
      cupSteam: s.level > 0 ? S.steam : 0,
      isRain: this.weather === '비',
      isSnow: this.weather === '눈',

      onCalendar: s.screen === 'calendar',
      onSession: s.screen === 'session',
      onClosing: s.screen === 'closing',
      onFortune: s.screen === 'fortune',

      monthTitle: Component.MONTHS[vm.getMonth()] + ' ' + vm.getFullYear(),
      contextLabel: S.name + ' · ' + W.name,
      visitLabel: s.visits + '번째 잔',
      ctaLabel: this.stage === 3 ? '자네 자리, 그대로 있어' : this.stage === 2 ? '오늘의 잔' : '오늘 한 잔 마시기',
      cells: this.buildCells(),
      prevMonth: () => this.shiftMonth(-1),
      nextMonth: () => this.shiftMonth(1),
      openSession: this.openSession,
      backToCalendar: this.backToCalendar,

      dateLabel: t.getDate() + ' ' + Component.MON3[t.getMonth()],
      teaLine: s.teaLine,
      userLine: s.userLine,
      bowlSrc: Component.BOWLS[Math.max(0, Math.min(6, Math.round((s.level / this.maxSips) * 6)))],
      draft: s.draft,
      onDraft: this.onDraft,
      onKey: this.onKey,
      send: this.send,
      sendSrc: (s.draft || '').trim() && !s.busy ? '../assets/ui/send_default.png' : '../assets/ui/send_disabled.png',
      canType: s.screen === 'session' && !cupEmpty,
      cupEmpty,
      refill: this.refill,
      finish: this.finish,

      closingLine: s.closingLine,
      blossomOpacity: s.showBlossom ? 1 : 0,
      hintOpacity: s.showHint ? 1 : 0,
      openFortune: this.openFortune,

      fortuneText: s.fortuneText,
      fortuneDate: s.fortuneDate,
      fortuneSeason: s.fortuneSeason,
      closeFortune: this.closeFortune
    };
  }
}
</script>
