name: fix-steam-position

on:
  push:
    branches:
      - implementation/steam-position-prototype
    paths:
      - .github/workflows/fix_steam_position.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/steam-position-prototype
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply steam position patch
        run: python3 tooling/fix_steam_position.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart
          git commit -m "Align steam with cup rim from prototype"
          git push origin HEAD:implementation/steam-position-prototype
