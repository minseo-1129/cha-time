name: polish-ripple-input

on:
  push:
    branches:
      - implementation/micro-polish-ripple-input

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply micro-polish patch
        run: python3 tooling/polish_ripple_input.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart
          git commit -m "Polish ripple and input alignment [skip ci]"
          git push origin HEAD:implementation/micro-polish-ripple-input
