name: apply-daily-one-cup-ui

on:
  push:
    branches:
      - implementation/daily-one-cup-ui
    paths:
      - .github/workflows/apply_daily_one_cup_ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/daily-one-cup-ui
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply daily one-cup UI patch
        run: python3 tooling/apply_daily_one_cup_ui.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart test/widget_test.dart README.md TYPEFACE.md pubspec.lock
          git commit -m "Limit cha-time to one cup per day and unify actions"
          git push origin HEAD:implementation/daily-one-cup-ui
