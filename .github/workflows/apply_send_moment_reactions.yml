name: apply-send-moment-reactions

on:
  push:
    branches:
      - implementation/send-moment-reactions
    paths:
      - .github/workflows/apply_send_moment_reactions.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/send-moment-reactions
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply send-moment patch
        run: python3 tooling/apply_send_moment_reactions.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart test/widget_test.dart
          git commit -m "Match send-moment reactions to weather spec"
          git push origin HEAD:implementation/send-moment-reactions
