name: apply-v4-source-fixes-current

on:
  push:
    branches:
      - implementation/cha-time-v4
    paths:
      - .github/workflows/apply_v4_source_fixes_current.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/cha-time-v4
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch Flutter analyzer issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/cha_time_app.dart')
          s = p.read_text()
          s2 = s.replace(
              "opacity: .42,",
              "opacity: const AlwaysStoppedAnimation(.42),",
          )
          s2 = s2.replace(
              "child: const Row(\n        children: [\n          for (final day in ['M', 'T', 'W', 'T', 'F', 'S', 'S'])",
              "child: Row(\n        children: [\n          for (final day in const ['M', 'T', 'W', 'T', 'F', 'S', 'S'])",
          )
          if s2 == s:
              raise SystemExit('Expected analyzer-fix patterns were not found')
          p.write_text(s2)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Commit verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart
          git commit -m "Fix cha-time v4 Flutter analyzer issues"
          git push origin HEAD:implementation/cha-time-v4
