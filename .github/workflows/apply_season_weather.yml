name: apply-season-weather

on:
  push:
    branches:
      - implementation/season-matrix-specials
    paths:
      - .github/workflows/apply_season_weather.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/season-matrix-specials
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply data-driven rainy-season fix
        run: python3 tooling/fix_data_driven_rainy_season.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cha_time_app.dart test/widget_test.dart
          git commit -m "Make rainy season data-driven and persist season"
          git push origin HEAD:implementation/season-matrix-specials
