name: apply-season-specials

on:
  push:
    branches: [implementation/season-matrix-specials]
    paths:
      - .github/workflows/apply_season_specials.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/season-matrix-specials
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply Season Matrix specials
        shell: bash
        run: |
          python3 - <<'PY'
