class AmbientParticles extends StatefulWidget {
  const AmbientParticles({
    super.key,
    required this.season,
    required this.weather,
    this.reducedOpacity = false,
    this.fadePassingShower = false,
  });

  final ChaSeason season;
  final ChaWeather weather;
  final bool reducedOpacity;
  final bool fadePassingShower;

  @override
  State<AmbientParticles> createState() => _AmbientParticlesState();
}

class _AmbientParticlesState extends State<AmbientParticles>
    with SingleTickerProviderStateMixin {
  late final AnimationController _controller;
  Timer? _showerTimer;
  bool _showerVisible = true;

  SeasonSpecial get _special => SeasonSpecial.of(widget.season, widget.weather);

  @override
  void initState() {
    super.initState();
    _controller = AnimationController(
      vsync: this,
      duration: _special.particleDuration(),
    )..repeat();
    if (_special.passingShower && widget.fadePassingShower) {
      _showerTimer = Timer(const Duration(seconds: 20), () {
        if (mounted) setState(() => _showerVisible = false);
      });
    }
  }

  @override
  void dispose() {
    _showerTimer?.cancel();
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    if (widget.weather != ChaWeather.rain &&
        widget.weather != ChaWeather.snow) {
      return const SizedBox.shrink();
    }

    final targetOpacity = !_showerVisible
        ? 0.0
        : widget.reducedOpacity
            ? .2
            : .4;

    return IgnorePointer(
      child: AnimatedOpacity(
        duration: Duration(
          milliseconds: _special.passingShower ? 2400 : 250,
        ),
        curve: Curves.easeOut,
        opacity: targetOpacity,
        child: AnimatedBuilder(
          animation: _controller,
          builder: (context, _) => CustomPaint(
            painter: ParticlePainter(
              progress: _controller.value,
              season: widget.season,
              weather: widget.weather,
            ),
            size: Size.infinite,
          ),
        ),
      ),
    );
  }
}

class ParticlePainter extends CustomPainter {
  ParticlePainter({
    required this.progress,
    required this.season,
    required this.weather,
  });

  final double progress;
  final ChaSeason season;
  final ChaWeather weather;

  @override
  void paint(Canvas canvas, Size size) {
    final special = SeasonSpecial.of(season, weather);
    final snow = weather == ChaWeather.snow;
    final count = special.particleCount(weather);
    final rainPaint = Paint()
      ..strokeWidth = 1.2 * special.rainWidthScale
      ..strokeCap = StrokeCap.round
      ..color = const Color(0x66829AA4);
    final snowPaint = Paint()..color = const Color(0x99FFFFFF);
    final petalPaint = Paint()..color = const Color(0x99D8AEB1);

    for (var i = 0; i < count; i++) {
      final seed = (i * 0.137 + .08) % 1;
      final baseX = size.width * ((seed * 7.3) % 1);
      final y = size.height * ((progress + seed) % 1);

      if (snow) {
        final radius = (2 + (i % 3)) * special.snowSizeScale;
        canvas.drawCircle(
          Offset(baseX + 18 * sin((progress + i) * pi * 2), y),
          radius,
          snowPaint,
        );
        continue;
      }

      final flowerPetal = special.kind == SeasonSpecialKind.flowerRain &&
          (i == 1 || i == 4 || i == 6);
      if (flowerPetal) {
        final sway = 15 * sin(progress * pi * 2 + i * .9);
        canvas.save();
        canvas.translate(baseX + sway, y);
        canvas.rotate(.35 * sin(progress * pi * 2 + i));
        canvas.drawOval(
          Rect.fromCenter(
            center: Offset.zero,
            width: 5.5,
            height: 9.5,
          ),
          petalPaint,
        );
        canvas.restore();
      } else {
        canvas.drawLine(
          Offset(baseX, y),
          Offset(baseX + 2, y + 11 + (i % 3) * 3),
          rainPaint,
        );
      }
    }
  }

  @override
  bool shouldRepaint(covariant ParticlePainter oldDelegate) =>
      oldDelegate.progress != progress ||
      oldDelegate.season != season ||
      oldDelegate.weather != weather;
}

class SendMomentOverlay extends StatefulWidget {
  const SendMomentOverlay({super.key, required this.weather});

  final ChaWeather weather;

  @override
  State<SendMomentOverlay> createState() => _SendMomentOverlayState();
}

class _SendMomentOverlayState extends State<SendMomentOverlay>
    with SingleTickerProviderStateMixin {
  late final AnimationController _controller;

  @override
  void initState() {
    super.initState();
    _controller = AnimationController(
      vsync: this,
      duration: Duration(
        milliseconds: widget.weather == ChaWeather.snow ? 900 : 700,
      ),
    )..forward();
  }

  @override
  void dispose() {
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    if (widget.weather == ChaWeather.cloudy) return const SizedBox.shrink();

    return IgnorePointer(
      child: AnimatedBuilder(
        animation: _controller,
        builder: (context, _) {
          final fade = sin(pi * _controller.value).clamp(0, 1).toDouble();
          if (widget.weather == ChaWeather.rain) {
            return Center(
              child: CustomPaint(
                size: const Size(180, 180),
                painter: RipplePainter(
                  progress: _controller.value,
                  opacity: fade,
                ),
              ),
            );
          }
          return Opacity(
            opacity: fade * (widget.weather == ChaWeather.clear ? .13 : .08),
            child: Container(
              decoration: const BoxDecoration(
                gradient: RadialGradient(
                  colors: [Color(0xFFFFFFFF), Color(0x00FFFFFF)],
                ),
              ),
            ),
          );
        },
      ),
    );
  }
}

class RipplePainter extends CustomPainter {
  RipplePainter({required this.progress, required this.opacity});

  final double progress;
  final double opacity;

  @override
  void paint(Canvas canvas, Size size) {
    final paint = Paint()
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.2
      ..color = Color.fromRGBO(120, 145, 150, opacity * .55);
    canvas.drawCircle(
      size.center(Offset.zero),
      12 + 58 * progress,
      paint,
    );
  }

  @override
  bool shouldRepaint(covariant RipplePainter oldDelegate) =>
      oldDelegate.progress != progress || oldDelegate.opacity != opacity;
}

class SeasonTrace extends StatelessWidget {
  const SeasonTrace({
    super.key,
    required this.season,
    required this.weather,
    required this.size,
  });

  final ChaSeason season;
  final ChaWeather weather;
  final double size;

  @override
  Widget build(BuildContext context) {
    final special = SeasonSpecial.of(season, weather);
    if (special.snowflakeTrace) {
      return SizedBox.square(
        dimension: size,
        child: CustomPaint(painter: SnowflakeTracePainter()),
      );
    }
    if (special.doubleBlossomTrace) {
      return SizedBox.square(
        dimension: size * 1.12,
        child: Stack(
          alignment: Alignment.center,
          children: [
            Transform.translate(
              offset: Offset(-size * .12, size * .05),
              child: Image.asset(
                'assets/images/trace_blossom.png',
                width: size * .82,
              ),
            ),
            Transform.translate(
              offset: Offset(size * .12, -size * .05),
              child: Transform.rotate(
                angle: .18,
                child: Image.asset(
                  'assets/images/trace_blossom.png',
                  width: size * .82,
                ),
              ),
            ),
          ],
        ),
      );
    }
    return Image.asset(
      'assets/images/trace_blossom.png',
      width: size,
      height: size,
      fit: BoxFit.contain,
    );
  }
}

class SnowflakeTracePainter extends CustomPainter {
  @override
  void paint(Canvas canvas, Size size) {
    final center = size.center(Offset.zero);
    final radius = min(size.width, size.height) * .42;
    final paint = Paint()
      ..color = const Color(0xFFB7C8D2)
      ..strokeWidth = max(1, size.width * .055)
      ..strokeCap = StrokeCap.round
      ..style = PaintingStyle.stroke;

    for (var i = 0; i < 3; i++) {
      final angle = i * pi / 3;
      final dx = cos(angle) * radius;
      final dy = sin(angle) * radius;
      canvas.drawLine(
        Offset(center.dx - dx, center.dy - dy),
        Offset(center.dx + dx, center.dy + dy),
        paint,
      );
    }
    canvas.drawCircle(center, max(1.2, size.width * .06), paint);
  }

  @override
  bool shouldRepaint(covariant SnowflakeTracePainter oldDelegate) => false;
}

