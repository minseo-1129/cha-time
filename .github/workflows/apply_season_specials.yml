              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)

          once("import 'dart:convert';\nimport 'dart:math';", "import 'dart:async';\nimport 'dart:convert';\nimport 'dart:math';", 'dart async import')

          once(
          """    required this.fortune,\n    required this.updatedAt,\n  });\n\n  final String date;\n  final bool finished;\n  final int sips;\n  final int cups;\n  final String fortune;\n  final String updatedAt;""",
          """    required this.fortune,\n    required this.updatedAt,\n    this.weather = '',\n  });\n\n  final String date;\n  final bool finished;\n  final int sips;\n  final int cups;\n  final String fortune;\n  final String updatedAt;\n  final String weather;""",
          'DayRecord weather field')

          once(
          """      fortune: json['fortune'] as String? ?? '',\n      updatedAt: json['updatedAt'] as String? ?? '',""",
          """      fortune: json['fortune'] as String? ?? '',\n      updatedAt: json['updatedAt'] as String? ?? '',\n      weather: json['weather'] as String? ?? '',""",
          'DayRecord fromJson weather')

          once(
          """        'fortune': fortune,\n        'updatedAt': updatedAt,""",
          """        'fortune': fortune,\n        'updatedAt': updatedAt,\n        'weather': weather,""",
          'DayRecord toJson weather')

          marker = """ChaWeather configuredWeather() {"""
          if marker not in s:
              raise SystemExit('configuredWeather marker not found')
          special_code = r'''
enum SeasonSpecialKind {
  none,
  flowerRain,
  summerShower,
  clearedSky,
  coldRain,
  drySunlight,
  firstSnow,
}

class SeasonSpecial {
  const SeasonSpecial(this.kind);

  final SeasonSpecialKind kind;

  static SeasonSpecial of(ChaSeason season, ChaWeather weather) {
    if (season == ChaSeason.spring && weather == ChaWeather.rain) {
      return const SeasonSpecial(SeasonSpecialKind.flowerRain);
    }
    if (season == ChaSeason.summer && weather == ChaWeather.rain) {
      return const SeasonSpecial(SeasonSpecialKind.summerShower);
    }
    if (season == ChaSeason.rainy && weather == ChaWeather.clear) {
      return const SeasonSpecial(SeasonSpecialKind.clearedSky);
    }
    if (season == ChaSeason.autumn && weather == ChaWeather.rain) {
      return const SeasonSpecial(SeasonSpecialKind.coldRain);
    }
    if (season == ChaSeason.winter && weather == ChaWeather.clear) {
      return const SeasonSpecial(SeasonSpecialKind.drySunlight);
    }
    if (season == ChaSeason.winter && weather == ChaWeather.snow) {
      return const SeasonSpecial(SeasonSpecialKind.firstSnow);
    }
    return const SeasonSpecial(SeasonSpecialKind.none);
  }

  Color paper(Color fallback) {
    switch (kind) {
      case SeasonSpecialKind.flowerRain:
        return const Color(0xFFF8F5F1);
      case SeasonSpecialKind.summerShower:
        return const Color(0xFFF5F8F2);
      case SeasonSpecialKind.clearedSky:
        return const Color(0xFFF6F8F4);
      case SeasonSpecialKind.coldRain:
        return const Color(0xFFF7F1E7);
      case SeasonSpecialKind.drySunlight:
        return const Color(0xFFF6F6F4);
      case SeasonSpecialKind.firstSnow:
        return const Color(0xFFF4F5F5);
      case SeasonSpecialKind.none:
        return fallback;
    }
  }

  String? get openingLine {
    switch (kind) {
      case SeasonSpecialKind.flowerRain:
        return '꽃 다 지겠다.';
      case SeasonSpecialKind.summerShower:
        return '한바탕 쏟아졌네.';
      case SeasonSpecialKind.clearedSky:
        return '오늘은 개었네.';
      case SeasonSpecialKind.coldRain:
        return '비 오니 춥지.';
      case SeasonSpecialKind.drySunlight:
        return '햇빛이 얇네.';
      case SeasonSpecialKind.firstSnow:
        return '눈 오는 날은 조용하지.';
      case SeasonSpecialKind.none:
        return null;
    }
  }

  double steamOpacity({
    required SeasonStyle season,
    required WeatherStyle weather,
    required double cap,
  }) {
    if (kind == SeasonSpecialKind.coldRain) return .45;
    return min(cap, season.steam * weather.steamMultiplier);
  }

  double get bowlScale => kind == SeasonSpecialKind.coldRain ? 1.06 : 1;
  bool get coldClearWash => kind == SeasonSpecialKind.drySunlight;
  bool get brightenOpening => kind == SeasonSpecialKind.clearedSky;
  bool get passingShower => kind == SeasonSpecialKind.summerShower;
  bool get doubleBlossomTrace => kind == SeasonSpecialKind.flowerRain;
  bool get snowflakeTrace => kind == SeasonSpecialKind.firstSnow;

  int particleCount(ChaWeather weather) {
    if (kind == SeasonSpecialKind.summerShower) return 14;
    if (kind == SeasonSpecialKind.flowerRain) return 8;
    if (weather == ChaWeather.rain) return 8;
    if (weather == ChaWeather.snow) return 7;
    return 0;
  }

  Duration particleDuration() {
    switch (kind) {
      case SeasonSpecialKind.flowerRain:
        // Matrix specifies 1.3x slower; the app's normal particle cycle is 8s.
        return const Duration(milliseconds: 10400);
      case SeasonSpecialKind.summerShower:
        return const Duration(milliseconds: 2800);
      case SeasonSpecialKind.firstSnow:
        return const Duration(seconds: 18);
      default:
        return const Duration(seconds: 8);
    }
  }

  double get rainWidthScale =>
      kind == SeasonSpecialKind.summerShower ? 1.4 : 1;
  double get snowSizeScale =>
      kind == SeasonSpecialKind.firstSnow ? 1.5 : 1;
}

ChaWeather weatherFromStored(String value) {
  switch (value) {
    case 'cloudy':
      return ChaWeather.cloudy;
    case 'rain':
      return ChaWeather.rain;
    case 'snow':
      return ChaWeather.snow;
    default:
      return ChaWeather.clear;
  }
}

